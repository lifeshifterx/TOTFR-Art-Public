name: Validate Public Art

'on':
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: totfr-public-art-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-public-art:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate public repository contents
        run: python tools/validate_public_art.py
      - name: Prove unsafe publication states are rejected
        run: python tools/test_public_art.py
